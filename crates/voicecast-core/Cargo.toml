[package]
name = "voicecast-core"
description = "Transport, membership, queue and playback. Portable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
voicecast-proto = { version = "0.1.0", path = "../voicecast-proto" }
voicecast-engine.workspace = true
voicecast-text.workspace = true
anyhow.workspace = true
interprocess = { version = "2.4.3", features = ["tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "sync", "process"] }
ciborium = "0.2.2"
serde.workspace = true
iroh-base = { version = "1.1", features = ["key"] }
directories = "6.0.0"
rand = "0.10.2"
thiserror.workspace = true
iroh = "1.1"
data-encoding = "2.11.1"

[lints]
workspace = true
