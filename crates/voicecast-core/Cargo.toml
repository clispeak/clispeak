[package]
name = "voicecast-core"
description = "Transport, membership, queue and playback. Portable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
voicecast-proto = { version = "0.1.0", path = "../voicecast-proto" }
voicecast-engine.workspace = true
voicecast-text.workspace = true
anyhow.workspace = true
interprocess = { version = "2.4.3", features = ["tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "sync", "process", "time"] }
ciborium = "0.2.2"
serde.workspace = true
iroh-base = { version = "1.1", features = ["key"] }
directories = "6.0.0"
serde_json = "1.0.151"
# Quiet hours are about when someone is asleep, so they need the *local*
# clock. `clock` pulls the platform's timezone on every target we build for.
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
rand = "0.10.2"
thiserror.workspace = true
iroh = "1.1"
data-encoding = "2.11.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[lints]
workspace = true
