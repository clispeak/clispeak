[package]
name = "clispeak-engine"
description = "Speech engine trait and per-platform implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
directories = "6.0.0"
serde_json = "1.0.151"
thiserror.workspace = true

# Not `workspace = true`: this crate owns the JNI boundary, which needs one
# `#[no_mangle]` entry point. Everything else still denies unsafe.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
todo = "allow"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# AVSpeechSynthesizer, the only speech on iOS. `objc2` and `objc2-foundation`
# are already in the tree by way of the webview, so these pin to the same
# major versions rather than pulling a second copy of the runtime.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSArray",
    "NSEnumerator",
] }
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std",
    "AVSpeechSynthesis",
    "AVAudioSessionTypes",
    # The silent switch mutes speech unless the session is set for playback,
    # and a phone in a pocket is a phone with the switch on.
    "AVAudioSession",
] }
# `run_on_main` and `MainThreadBound`, which are how the synthesizer is used
# from a tokio worker without anyone asserting it is `Send`.
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
