[package]
name = "voicecast-cli"
description = "The voicecast binary. A thin client to the local node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "voicecast"
path = "src/main.rs"

[dependencies]
voicecast-proto.workspace = true
voicecast-text.workspace = true
anyhow.workspace = true
interprocess = { version = "2.4.3", features = ["tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util"] }
ciborium = "0.2.2"
clap = { version = "4.6.6", features = ["derive"] }
serde.workspace = true
serde_json = "1.0.151"
# Groups and defaults live in config.toml, as documented in docs/cli.md.
toml = "0.9.9"
directories = "6.0.0"

[lints]
workspace = true
