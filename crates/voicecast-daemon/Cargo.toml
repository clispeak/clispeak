[package]
name = "voicecast-daemon"
description = "The node process. Desktop only; the Tauri app replaces it at M6."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "voicecastd"
path = "src/main.rs"

[dependencies]
voicecast-core.workspace = true
voicecast-engine.workspace = true
anyhow.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Desktop keystores only. Kept out of voicecast-core deliberately: this crate
# is excluded from the mobile CI targets, so core stays buildable everywhere.
voicecast-keystore.workspace = true

[lints]
workspace = true
