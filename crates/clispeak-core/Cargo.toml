[package]
name = "clispeak-core"
description = "Transport, membership, queue and playback. Portable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
clispeak-proto = { version = "0.1.0", path = "../clispeak-proto" }
clispeak-engine.workspace = true
clispeak-text.workspace = true
anyhow.workspace = true
interprocess = { version = "2.4.3", features = ["tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "sync", "process", "time"] }
ciborium = "0.2.2"
serde.workspace = true
iroh-base = { version = "1.1", features = ["key"] }
directories = "6.0.0"
serde_json = "1.0.151"
# Quiet hours are about when someone is asleep, so they need the *local*
# clock. `clock` pulls the platform's timezone on every target we build for.
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
rand = "0.10.2"
# Keyed hashing for the local socket handshake. `blake3::Hash` also compares
# in constant time, which is why the proof check is between hashes.
# `no_neon` because blake3's NEON path does not link on iOS: the C object
# `blake3_neon.o` leaves `_blake3_hash4_neon` undefined for arm64, and the
# five-target matrix caught it — `cargo build` for aarch64-apple-ios failed
# at link with everything green on Linux. blake3's build script compiles that
# C on any little-endian aarch64 unless this is set, so it also applies to
# Android and Apple silicon; the portable Rust fallback is correct and the
# inputs here are fifty bytes. Features are additive, so this holds for every
# blake3 in the tree.
blake3 = { version = "1.8", features = ["no_neon"] }
thiserror.workspace = true
iroh = "1.1"
data-encoding = "2.11.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
gethostname = "1"

[lints]
workspace = true
