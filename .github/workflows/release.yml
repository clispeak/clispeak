# Packaging, on version tags only.
#
# The five-target compile check in ci.yml earns its place on every commit —
# it is the portability rule, and it caught a Windows break that local checks
# could not see. Building a Flatpak, a signed app, an APK and an installer
# does not: none of it says whether a commit compiles, and all of it runs on
# the runners that cost the most.
#
# The release is left as a **draft**. Nothing here should become a public
# download until the licensing of what we bundle is understood — we ship
# Piper, which carries espeak-ng, ONNX Runtime, a phonemiser and a voice
# model, and the archive we redistribute contains no licence text at all.
# See issue #24 and docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*']
  # So the packaging path can be exercised without minting a version.
  workflow_dispatch:
    inputs:
      only:
        description: "One platform, when testing a fix to that job"
        required: false
        type: choice
        default: all
        options: [all, linux, macos, windows, android]

# Read by default. Only `draft` creates anything, and the four build jobs
# below execute roughly seven hundred crates' build scripts, Gradle plugins,
# npm lifecycle scripts and flatpak-builder — all of which can read
# GITHUB_TOKEN out of the environment. Handing that set a token that can push
# to any branch and publish releases is a large surface for no gain (#70).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macos
    if: inputs.only == null || inputs.only == 'all' || inputs.only == 'macos'
    # Bounded so a hung build fails rather than burning the default six
    # hours, which on a macOS runner bills at ten times the Linux rate (#70).
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-macos
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Frontend dependencies
        working-directory: app
        # `npm ci`, never `npm install`: the fallback meant that a lockfile out
        # of step with package.json silently resolved `^` ranges fresh from the
        # registry, so a tag build could ship whatever Tauri CLI was published
        # that morning with nothing recording which. The drift it hid is
        # exactly what should fail the run (#70).
        run: npm ci
      - name: Build the bundle
        run: cargo run -p xtask -- bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          # Unsigned: signing needs a certificate in a keychain we do not
          # have. macOS warns on first open until that is sorted.
          #
          # The workspace target directory is at the repository root, not
          # under the Tauri crate — the bundler writes there like any other
          # cargo output. Getting this wrong built the bundle and then failed
          # the upload, which reads as a build failure.
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: windows
    if: inputs.only == null || inputs.only == 'all' || inputs.only == 'windows'
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-windows
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Frontend dependencies
        working-directory: app
        # `npm ci`, never `npm install`: the fallback meant that a lockfile out
        # of step with package.json silently resolved `^` ranges fresh from the
        # registry, so a tag build could ship whatever Tauri CLI was published
        # that morning with nothing recording which. The drift it hid is
        # exactly what should fail the run (#70).
        run: npm ci
      - name: Build the bundle
        run: cargo run -p xtask -- bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: android
    if: inputs.only == null || inputs.only == 'all' || inputs.only == 'android'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-android
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Frontend dependencies
        working-directory: app
        # `npm ci`, never `npm install`: the fallback meant that a lockfile out
        # of step with package.json silently resolved `^` ranges fresh from the
        # registry, so a tag build could ship whatever Tauri CLI was published
        # that morning with nothing recording which. The drift it hid is
        # exactly what should fail the run (#70).
        run: npm ci

      # The *release* variant, unsigned. Signing needs a keystore nobody has
      # created yet (#31), but signing is not what this flag controlled:
      # `--debug` also turned off R8, so the only APK this workflow has ever
      # produced was the one build nobody would download. The first release
      # APK to reach a real phone died on launch because R8 had deleted the
      # Kotlin the engine calls, and this job would not have caught it (#41,
      # #68). `xtask portability` gates the keep rules; this compiles them.
      #
      # NDK_HOME comes from the runner's own environment, which the `env`
      # context does not see — that context holds only what a workflow, job
      # or step declares, so `${{ env.ANDROID_NDK_LATEST_HOME }}` expands to
      # nothing and the build fails looking for an NDK at the empty path.
      - name: Build the APK
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "using NDK at $NDK_HOME"
          npx @tauri-apps/cli android build --apk --target aarch64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  flatpak:
    name: linux
    if: inputs.only == null || inputs.only == 'all' || inputs.only == 'linux'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-linux

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            flatpak flatpak-builder
          # A *user* remote, because the build below is `--user`. Adding it
          # with sudo puts it on the system installation, which a --user
          # build does not consult — so `--install-deps-from=flathub` finds
          # no such remote and the runtime never downloads.
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Frontend dependencies
        working-directory: app
        # See the note on the other npm steps: never the install fallback.
        run: |
          npm ci
          npx tailwindcss -i src/input.css -o src/styles.css --minify

      # The manifest takes prebuilt binaries: flatpak-builder runs offline,
      # so a source build inside it would need vendored crates.
      - name: Build the binaries
        run: cargo build --release -p voicecast-app -p voicecast-cli

      # The runtime is installed by name rather than left to
      # `--install-deps-from`, which resolves quietly and gives nothing to
      # read when it does not. These are the two the manifest names.
      - name: Flatpak runtime
        run: |
          flatpak install --user -y flathub \
            org.gnome.Platform//49 org.gnome.Sdk//49
          flatpak --user list --runtime

      - name: Build the Flatpak
        working-directory: packaging/flatpak
        run: |
          set -x
          flatpak-builder --user --repo=repo --force-clean \
            build-dir org.voicecast.App.yml
          flatpak build-bundle repo voicecast.flatpak org.voicecast.App

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: packaging/flatpak/voicecast.flatpak
          if-no-files-found: error

  draft:
    name: draft release
    needs: [macos, windows, android, flatpak]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # The one job that publishes anything.
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artefacts
      # Nothing signs these yet (#29, #31), so a checksum is the only way a
      # person can tell what they downloaded from what this built. It matters
      # more, not less, once #23 serves them from somewhere other than the
      # release page — a bad upload and a tampered one look identical without
      # it. Paths are relative to `artefacts/` so the file reads the same
      # wherever it is unpacked.
      - name: Checksum the artefacts
        working-directory: artefacts
        run: |
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Draft a release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: artefacts/**/*
          body: |
            Built from ${{ github.ref_name }}.

            **A draft, deliberately.** Nothing here should become a public
            download until the licensing of what these packages bundle is
            settled — see issue #24.

            The macOS app is unsigned and the Android APK is an unsigned
            *release* build. Both need credentials that do not exist yet —
            see #29 and #31. `SHA256SUMS` lists what each file should hash
            to; it is not a signature, and it is only as trustworthy as the
            page you read it from.
