# Packaging, on version tags only.
#
# The five-target compile check in ci.yml earns its place on every commit —
# it is the portability rule, and it caught a Windows break that local checks
# could not see. Building a Flatpak, a signed app, an APK and an installer
# does not: none of it says whether a commit compiles, and all of it runs on
# the runners that cost the most.
#
# The release is left as a **draft**. Nothing here should become a public
# download until the licensing of what we bundle is understood — we ship
# Piper, which carries espeak-ng, ONNX Runtime, a phonemiser and a voice
# model, and the archive we redistribute contains no licence text at all.
# See issue #24 and docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*']
  # So the packaging path can be exercised without minting a version.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            # Unsigned: signing needs a certificate in a keychain we do not
            # have. macOS will warn on first open until that is sorted.
            artefacts: app/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows
            artefacts: app/src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend dependencies
        working-directory: app
        run: npm ci || npm install

      # Stages the CLI as a sidecar, fetches Piper and a voice, then runs
      # `tauri build` with the bundle config. Platform-generic: a .dmg on
      # macOS, an NSIS installer on Windows, from one recipe.
      - name: Build the bundle
        run: cargo run -p xtask -- bundle

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artefacts }}
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Frontend dependencies
        working-directory: app
        run: npm ci || npm install

      # Debug-signed. A public APK needs a release keystore, which is a
      # secret nobody has created yet — see docs/releasing.md.
      - name: Build the APK
        working-directory: app
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: npx @tauri-apps/cli android build --apk --debug --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  flatpak:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend dependencies
        working-directory: app
        run: |
          npm ci || npm install
          npx tailwindcss -i src/input.css -o src/styles.css --minify

      # The manifest takes prebuilt binaries: flatpak-builder runs offline,
      # so a source build inside it would need vendored crates.
      - name: Build the binaries
        run: cargo build --release -p voicecast-app -p voicecast-cli

      - name: Build the Flatpak
        working-directory: packaging/flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub \
            --repo=repo --force-clean build-dir org.voicecast.App.yml
          flatpak build-bundle repo voicecast.flatpak org.voicecast.App

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: packaging/flatpak/voicecast.flatpak
          if-no-files-found: error

  draft:
    name: draft release
    needs: [desktop, android, flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Draft a release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artefacts/**/*
          body: |
            Built from ${{ github.ref_name }}.

            **A draft, deliberately.** Nothing here should become a public
            download until the licensing of what these packages bundle is
            settled — see issue #24.

            The macOS app is unsigned and the Android APK is debug-signed.
            Both need credentials that do not exist yet.
