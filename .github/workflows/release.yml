# Packaging, on version tags only.
#
# The five-target compile check in ci.yml earns its place on every commit —
# it is the portability rule, and it caught a Windows break that local checks
# could not see. Building a Flatpak, a signed app, an APK and an installer
# does not: none of it says whether a commit compiles, and all of it runs on
# the runners that cost the most.
#
# The release is left as a **draft**. Nothing here should become a public
# download until the licensing of what we bundle is understood — we ship
# Piper, which carries espeak-ng, ONNX Runtime, a phonemiser and a voice
# model, and the archive we redistribute contains no licence text at all.
# See issue #24 and docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*']
  # So the packaging path can be exercised without minting a version.
  workflow_dispatch:
    inputs:
      only:
        description: "One platform, when testing a fix to that job"
        required: false
        type: choice
        default: all
        options: [all, linux, macos, windows, android]

# Read by default. Only `draft` creates anything, and the four build jobs
# below execute roughly seven hundred crates' build scripts, Gradle plugins,
# npm lifecycle scripts and flatpak-builder — all of which can read
# GITHUB_TOKEN out of the environment. Handing that set a token that can push
# to any branch and publish releases is a large surface for no gain (#70).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macos
    if: inputs.only == null || inputs.only == 'all' || inputs.only == 'macos'
    # Bounded so a hung build fails rather than burning the default six
    # hours, which on a macOS runner bills at ten times the Linux rate (#70).
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-macos
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Frontend dependencies
        working-directory: app
        # `npm ci`, never `npm install`: the fallback meant that a lockfile out
        # of step with package.json silently resolved `^` ranges fresh from the
        # registry, so a tag build could ship whatever Tauri CLI was published
        # that morning with nothing recording which. The drift it hid is
        # exactly what should fail the run (#70).
        run: npm ci
      # **No signing credentials here, deliberately.** This step runs
      # `npm ci` and several hundred crates' build scripts, and a Developer
      # ID certificate in its environment is readable by every one of them.
      # The blast radius is what makes that different from the Android key:
      # an Android keystore signs *this app* and nothing else, while a
      # Developer ID signs anything at all as Patrick — malware included,
      # trusted by every Mac because his name is on it (#117).
      #
      # So the build produces an ad-hoc signed, un-notarised bundle, and the
      # `macos-sign` job below turns it into a shippable one. That job runs
      # `codesign`, `hdiutil` and `notarytool` and nothing else.
      - name: Build the bundle
        run: cargo run -p xtask -- bundle

      # Read back what was actually produced, rather than trusting that the
      # variables took effect.
      #
      # An app configured to sign that silently did not is indistinguishable
      # from a signed one without reading the designated requirement — an
      # ad-hoc signature is still a signature, and `codesign -v` passes on it.
      # That shape has cost this repository a fortnight more than once: the
      # reason exists and something between it and the reader drops it. So the
      # run prints the requirement either way, and fails only for the one
      # combination that is a lie — secrets present, artefact still ad-hoc.
      - name: Say how the bundle is signed
        run: |
          app=target/release/bundle/macos/clispeak.app
          codesign -dv --verbose=2 "$app" 2>&1 || true
          requirement=$(codesign -d -r- "$app" 2>&1 | tail -1)
          echo "designated requirement: $requirement"
          case "$requirement" in
            *cdhash*)
              echo "Ad-hoc, as this job intends: no certificate is present" \
                   "here. `macos-sign` signs and notarises what this built."
              ;;
            *"designated =>"*)
              echo "Signed with a certificate: the requirement names an" \
                   "identifier and an issuer, so later builds satisfy it."
              ;;
            *)
              # Not a third state of the signature — a signature that could
              # not be read at all, because the app is not where this step
              # looked. Matching a bare `*)` as "signed" was the first shape
              # of this step, and a deliberately wrong path made it announce
              # a signed build for an app that did not exist.
              echo "::error::could not read a designated requirement from" \
                   "$app: $requirement"
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-unsigned
          # The workspace target directory is at the repository root, not
          # under the Tauri crate — the bundler writes there like any other
          # cargo output. Getting this wrong built the bundle and then failed
          # the upload, which reads as a build failure.
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Everything that touches the Developer ID certificate, and nothing else.
  #
  # The whole point of this job is what is *absent* from it: no `npm ci`, no
  # `cargo build`, no crate build scripts, no Gradle. It downloads a dmg that
  # was already built, runs Apple's own tools over it, and uploads the result.
  # A dependency compromised anywhere in the build cannot reach the
  # certificate, because the certificate is not in that job (#117).
  #
  # `environment:` is the gate. Give `macos-signing` a required reviewer in
  # the repository settings and the secrets below are not decrypted until a
  # human approves the run — so the certificate is unreachable even to a
  # workflow edited on a branch.
  macos-sign:
    name: macos (sign and notarise)
    needs: macos
    if: inputs.only == null || inputs.only == 'all' || inputs.only == 'macos'
    environment: macos-signing
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-unsigned
          path: unsigned

      # Signing is all-or-nothing: Apple refuses to notarise anything that is
      # not already signed with a Developer ID, so a certificate without a
      # notarisation key, or the reverse, gets nobody anywhere. Checked once,
      # here, rather than failing halfway through with a keychain to clean up.
      - name: Are the credentials present
        id: creds
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$IDENTITY" ] && [ -n "$P8" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signing=false" >> "$GITHUB_OUTPUT"
          echo "::warning::No signing credentials, so the release carries" \
               "the unsigned dmg from the build job. Gatekeeper refuses that" \
               "on any machine that downloads it (#29, #108)."

      # A keychain of our own, deleted on the way out. Never the login
      # keychain: this runner is disposable, but the habit is what stops the
      # same script being run one day on a machine that is not.
      - name: Import the certificate
        if: steps.creds.outputs.signing == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # `--decode`, not `-d`: this is macOS, where the short flag is
          # `-D`. The Android job's `-d` is correct only because it runs on
          # Linux, and getting it wrong here writes an empty file that fails
          # later, somewhere else.
          printf '%s' "$CERT" | base64 --decode > cert.p12
          security create-keychain -p runner build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p runner build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          # Without this, codesign prompts for keychain access and hangs a
          # job that has nobody to answer it.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k runner build.keychain
          security list-keychains -d user -s build.keychain
          rm -f cert.p12

      # Signed *inside* Tauri's own dmg rather than rebuilt around the app.
      # A dmg made here with `hdiutil create` would lose the window layout
      # and background the bundler produces, so the download would look
      # different for a reason that has nothing to do with signing. Convert
      # to a writable image, sign in place, convert back.
      - name: Sign the app inside the disk image
        if: steps.creds.outputs.signing == 'true'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          dmg=$(ls unsigned/*.dmg)
          echo "signing the app inside $dmg"
          hdiutil convert "$dmg" -format UDRW -o rw.dmg
          hdiutil attach rw.dmg -mountpoint mnt -nobrowse -quiet
          app=$(ls -d mnt/*.app)
          # Nested code first, then the bundle. `--deep` is Apple's own
          # discouraged shortcut and signs things it should not; the sidecar
          # command-line tool is the only nested binary here and it is worth
          # naming rather than sweeping up.
          find "$app/Contents/MacOS" -type f -perm +111 | while read -r bin; do
            codesign --force --timestamp --options runtime \
              --sign "$IDENTITY" "$bin"
          done
          codesign --force --timestamp --options runtime \
            --sign "$IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"
          hdiutil detach mnt -quiet
          hdiutil convert rw.dmg -format UDZO -o signed.dmg
          codesign --force --timestamp --sign "$IDENTITY" signed.dmg

      - name: Notarise and staple
        if: steps.creds.outputs.signing == 'true'
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$P8" | base64 --decode > AuthKey.p8
          # `--wait`, so the job's verdict is the notarisation's verdict
          # rather than "submitted successfully", which is true of a
          # submission Apple later rejects.
          xcrun notarytool submit signed.dmg \
            --key AuthKey.p8 --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          xcrun stapler staple signed.dmg
          rm -f AuthKey.p8

      # Ask the artefact, not the log. Every check here has cost this
      # repository time by being taken on trust once already: a signature
      # that is really ad-hoc, a notarisation that was configured and did not
      # happen, a path that pointed at nothing and reported success anyway.
      - name: Say what actually shipped
        if: steps.creds.outputs.signing == 'true'
        run: |
          hdiutil attach signed.dmg -mountpoint check -nobrowse -quiet
          app=$(ls -d check/*.app)
          requirement=$(codesign -d -r- "$app" 2>&1 | tail -1)
          echo "designated requirement: $requirement"
          case "$requirement" in
            *cdhash*)
              echo "::error::still ad-hoc after signing — the certificate" \
                   "did not reach codesign, and its identity is a build hash"
              exit 1
              ;;
            *"designated =>"*) echo "signed with a certificate" ;;
            *)
              echo "::error::could not read a designated requirement: $requirement"
              exit 1
              ;;
          esac
          # The question a downloader's Mac actually asks.
          spctl --assess --type exec --verbose=2 "$app"
          xcrun stapler validate "$app"
          hdiutil detach check -quiet

      - name: Remove the keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f cert.p12 AuthKey.p8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: ${{ steps.creds.outputs.signing == 'true' && 'signed.dmg' || 'unsigned/*.dmg' }}
          if-no-files-found: error

  windows:
    name: windows
    if: inputs.only == null || inputs.only == 'all' || inputs.only == 'windows'
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-windows
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Frontend dependencies
        working-directory: app
        # `npm ci`, never `npm install`: the fallback meant that a lockfile out
        # of step with package.json silently resolved `^` ranges fresh from the
        # registry, so a tag build could ship whatever Tauri CLI was published
        # that morning with nothing recording which. The drift it hid is
        # exactly what should fail the run (#70).
        run: npm ci
      - name: Build the bundle
        run: cargo run -p xtask -- bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: android
    if: inputs.only == null || inputs.only == 'all' || inputs.only == 'android'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-android
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Frontend dependencies
        working-directory: app
        # `npm ci`, never `npm install`: the fallback meant that a lockfile out
        # of step with package.json silently resolved `^` ranges fresh from the
        # registry, so a tag build could ship whatever Tauri CLI was published
        # that morning with nothing recording which. The drift it hid is
        # exactly what should fail the run (#70).
        run: npm ci

      # The *release* variant, unsigned. Signing needs a keystore nobody has
      # created yet (#31), but signing is not what this flag controlled:
      # `--debug` also turned off R8, so the only APK this workflow has ever
      # produced was the one build nobody would download. The first release
      # APK to reach a real phone died on launch because R8 had deleted the
      # Kotlin the engine calls, and this job would not have caught it (#41,
      # #68). `xtask portability` gates the keep rules; this compiles them.
      #
      # NDK_HOME comes from the runner's own environment, which the `env`
      # context does not see — that context holds only what a workflow, job
      # or step declares, so `${{ env.ANDROID_NDK_LATEST_HOME }}` expands to
      # nothing and the build fails looking for an NDK at the empty path.
      # Signs only when all four secrets are present. With none of them the
      # job still builds and says the APK is unsigned — which is today, and
      # is not an error. See docs/signing-android.md.
      #
      # `gen/android/app/`, next to build.gradle.kts: `file()` in a Gradle
      # script resolves against the module directory, so a copy one level up
      # is read as absent and the build comes out unsigned with nothing said.
      - name: Configure signing
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] \
             || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "no Android signing secrets; the APK will be unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir=app/src-tauri/gen/android/app
          printf '%s' "$KEYSTORE" | base64 -d > "$dir/release.jks"
          {
            echo "storeFile=$GITHUB_WORKSPACE/$dir/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$dir/keystore.properties"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: app
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "using NDK at $NDK_HOME"
          npx @tauri-apps/cli android build --apk --target aarch64

      # Read the signature back rather than trusting that the secrets took.
      # A build configured to sign that silently did not is indistinguishable
      # from a signed one without asking — the same reasoning as the macOS
      # job's `codesign -d -r-` check.
      - name: Check what signed it
        run: |
          # Exactly one, not the first of several. A split build or a
          # leftover in an unclean workspace would otherwise have this
          # report on an arbitrary file, which is a check that passes about
          # something other than what ships.
          out=app/src-tauri/gen/android/app/build/outputs/apk
          count=$(find "$out" -name '*.apk' | wc -l)
          if [ "$count" != "1" ]; then
            echo "expected one APK under $out, found $count:"
            find "$out" -name '*.apk'
            exit 1
          fi
          apk=$(find "$out" -name '*.apk')
          echo "artefact: $apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            echo "built unsigned, as configured — Android will not install this"
            case "$apk" in
              *unsigned*) exit 0 ;;
              *) echo "expected an unsigned artefact and did not get one"; exit 1 ;;
            esac
          fi
          "$signer" verify --print-certs "$apk"

      # `run: |`, not a plain scalar. Written without the pipe, YAML folds
      # the two lines into one and the `\` survives as a literal backslash,
      # so the shell reads `\ ` as an escaped space and the second path
      # becomes an argument with a leading space — a file that does not
      # exist. `-f` makes that silent, and the step reports success having
      # removed only the keystore and left the file holding the three
      # passwords in plain text. Reproduced, not reasoned about.
      - name: Remove the keystore
        if: always()
        run: |
          rm -f app/src-tauri/gen/android/app/release.jks \
                app/src-tauri/gen/android/app/keystore.properties

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  flatpak:
    name: linux
    if: inputs.only == null || inputs.only == 'all' || inputs.only == 'linux'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-linux

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            flatpak flatpak-builder
          # A *user* remote, because the build below is `--user`. Adding it
          # with sudo puts it on the system installation, which a --user
          # build does not consult — so `--install-deps-from=flathub` finds
          # no such remote and the runtime never downloads.
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Frontend dependencies
        working-directory: app
        # See the note on the other npm steps: never the install fallback.
        run: |
          npm ci
          npx tailwindcss -i src/input.css -o src/styles.css --minify

      # The manifest takes prebuilt binaries: flatpak-builder runs offline,
      # so a source build inside it would need vendored crates.
      - name: Build the binaries
        run: cargo build --release -p clispeak-app -p clispeak-cli

      # The runtime is installed by name rather than left to
      # `--install-deps-from`, which resolves quietly and gives nothing to
      # read when it does not. These are the two the manifest names.
      - name: Flatpak runtime
        run: |
          flatpak install --user -y flathub \
            org.gnome.Platform//49 org.gnome.Sdk//49
          flatpak --user list --runtime

      - name: Build the Flatpak
        working-directory: packaging/flatpak
        run: |
          set -x
          flatpak-builder --user --repo=repo --force-clean \
            build-dir org.clispeak.app.yml
          flatpak build-bundle repo clispeak.flatpak org.clispeak.app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: packaging/flatpak/clispeak.flatpak
          if-no-files-found: error

  draft:
    name: draft release
    # `macos-sign`, not `macos`: the build job now uploads
    # `macos-unsigned`, and the artefact this release attaches is the one the
    # signing job produces. Depending on the build would have let the draft
    # be created from an artefact that does not exist yet — or, worse, from
    # a stale one on a re-run.
    needs: [macos-sign, windows, android, flatpak]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # The one job that publishes anything.
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artefacts
      # Nothing signs these yet (#29, #31), so a checksum is the only way a
      # person can tell what they downloaded from what this built. It matters
      # more, not less, once #23 serves them from somewhere other than the
      # release page — a bad upload and a tampered one look identical without
      # it. Paths are relative to `artefacts/` so the file reads the same
      # wherever it is unpacked.
      - name: Checksum the artefacts
        working-directory: artefacts
        run: |
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Draft a release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: artefacts/**/*
          body: |
            Built from ${{ github.ref_name }}.

            **A draft, deliberately.** Nothing here should become a public
            download until the licensing of what these packages bundle is
            settled — see issue #24.

            The macOS app is unsigned and the Android APK is an unsigned
            *release* build. Both need credentials that do not exist yet —
            see #29 and #31. `SHA256SUMS` lists what each file should hash
            to; it is not a signature, and it is only as trustworthy as the
            page you read it from.
