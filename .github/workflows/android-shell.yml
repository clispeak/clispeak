# Compiles the Android *shell* — the Kotlin, the manifest and the resources.
#
# `ci.yml` builds the Rust for `aarch64-linux-android` on every pull request,
# and nothing built the 46 tracked files under `gen/android` until a `v*` tag
# (#96). So a syntax error, a bad resource reference or a manifest attribute
# that does not resolve reached a release with nothing having read it. Three
# bugs were fixed in that shell in one day (#60, #61) and a manifest change
# made (#57); every one was compiled locally and none by CI.
#
# **Only when the shell changes**, which is Patrick's decision and is
# proportionate: the Rust half is covered on every pull request already, so
# what is uncovered is exactly the part that changes when somebody edits it.
# The named trap is that a change *elsewhere* breaking the Android build is
# not caught here — mitigated a little by `xtask portability`, which fails if
# the JNI classes the engine calls stop matching.
#
# The cost argument in #96 was about billed minutes on a private repository
# and no longer applies: the repository is public and standard runners are
# free. What this still spends is wall-clock on the pull requests it runs for,
# which is why it is filtered rather than universal.
name: Android shell

on:
  push:
    branches: [main]
    paths:
      - 'app/src-tauri/gen/android/**'
      - 'app/src-tauri/tauri.conf.json'
      - 'crates/clispeak-engine/src/android.rs'
      - '.github/workflows/android-shell.yml'
  # Written out twice rather than with a YAML anchor. The anchor parses —
  # every YAML library accepts it, including the gate in `xtask` — and
  # GitHub Actions does not support anchors, so the workflow would simply
  # not load. That is the failure this repository keeps meeting: not an
  # error, an absence. Duplication is the cheaper half of that trade.
  pull_request:
    paths:
      - 'app/src-tauri/gen/android/**'
      - 'app/src-tauri/tauri.conf.json'
      - 'crates/clispeak-engine/src/android.rs'
      - '.github/workflows/android-shell.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  shell:
    name: kotlin · manifest · resources
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: android-shell
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Frontend dependencies
        working-directory: app
        # `npm ci`, never `npm install` — see the same step in release.yml.
        run: npm ci

      # The **release** variant, not `--debug`, because that is what ships and
      # because debug turns R8 off: `isMinifyEnabled` is true only for
      # release, and R8 once deleted the Kotlin the engine calls (#41).
      #
      # Compiling it does not prove R8 kept what is needed — a deletion shows
      # up when the missing method is *called*, which is a launch and is #45.
      # This catches the half that is a compile error, which is the half that
      # was reaching tags unread.
      #
      # Unsigned, deliberately: no secrets are used here, and an APK nobody
      # installs does not need a signature. The artefact is discarded.
      - name: Build the Android shell
        working-directory: app
        run: npx @tauri-apps/cli android build --apk --target aarch64
