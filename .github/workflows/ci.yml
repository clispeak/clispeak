name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref — on a branch.
#
# Never on `main`. Cancelling there means a commit can land with no verdict at
# all, which from the outside looks exactly like a commit that passed: the run
# page shows "cancelled", nobody reads it, and the next person to branch
# inherits the breakage. That happened on three consecutive pushes to main and
# was found by a teammate whose own pull request went red on a line they had
# never touched (#91).
#
# It costs Linux minutes on a fast series of pushes and buys a verdict for
# every commit on the branch everyone else starts from. The rule this project
# opens with is "check the CI run, not your terminal", and that rule needs
# there to *be* a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · portability · test
    # Bounded so a hung build fails rather than burning the default six
    # hours, which on a macOS runner bills at ten times the Linux rate (#70).
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Tauri needs GTK and WebKit headers on Linux; without them the app
      # crate fails at pkg-config time and takes the whole job with it.
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # Fails if a portable crate grows a platform conditional. This is the
      # rule that keeps macOS, Windows and iOS cheap to add later.
      - run: cargo run -p xtask -- portability
      - run: cargo test --workspace

  build:
    name: ${{ matrix.target }}
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-linux-android
            android: true
          # Both Apple targets on one runner. They were two jobs, each
          # paying its own checkout, toolchain install and cache restore on
          # the most expensive runner GitHub sells — macOS bills at ten times
          # Linux, and was two thirds of a day's spend on a fifth of the
          # minutes. Same coverage, half the macOS jobs.
          - os: macos-latest
            target: aarch64-apple-darwin
            also: aarch64-apple-ios
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}${{ matrix.also && format(',{0}', matrix.also) || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      # Tauri needs GTK and WebKit headers on Linux; without them the app
      # crate fails at pkg-config time and takes the whole job with it.
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install cargo-ndk
        if: matrix.android
        run: cargo install cargo-ndk --locked

      # xtask is host-only tooling and is never cross-compiled;
      # voicecast-daemon links a desktop keyring and is superseded on a phone
      # by the app itself.
      #
      # voicecast-app is *included*, unlike before. Excluding it meant the
      # Android job compiled the libraries and skipped the one crate that
      # actually ships on a phone — so a desktop-only call added to its
      # `cfg(target_os = "android")` paths passed every job and failed on a
      # tag, twenty minutes into a release (#69).
      - name: Build (android)
        if: matrix.android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a build --workspace \
            --exclude xtask --exclude voicecast-daemon \
            --exclude voicecast-keystore

      # voicecast-daemon is desktop-only: it links platform keyrings and is
      # superseded by the Tauri app at M6.
      - name: Build
        if: '!matrix.android'
        run: cargo build --workspace --exclude xtask --target ${{ matrix.target }}

      # iOS, on the same runner. voicecast-daemon and voicecast-keystore are
      # desktop-only, and voicecast-app is built by Tauri's own mobile
      # tooling rather than by cargo.
      - name: Build (second Apple target)
        if: matrix.also
        run: |
          cargo build --workspace \
            --exclude xtask --exclude voicecast-daemon \
            --exclude voicecast-keystore --exclude voicecast-app \
            --target ${{ matrix.also }}
