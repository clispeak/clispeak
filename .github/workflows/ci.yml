name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · portability · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # Fails if a portable crate grows a platform conditional. This is the
      # rule that keeps macOS, Windows and iOS cheap to add later.
      - run: cargo run -p xtask -- portability
      - run: cargo test --workspace

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-linux-android
            android: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-ios
            mobile: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-ndk
        if: matrix.android
        run: cargo install cargo-ndk --locked

      # xtask is host-only tooling and is never cross-compiled.
      - name: Build (android)
        if: matrix.android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a build --workspace --exclude xtask --exclude voicecast-daemon

      # voicecast-daemon is desktop-only: it links platform keyrings and is
      # superseded by the Tauri app at M6.
      - name: Build (mobile)
        if: matrix.mobile
        run: cargo build --workspace --exclude xtask --exclude voicecast-daemon --target ${{ matrix.target }}

      - name: Build
        if: '!matrix.android && !matrix.mobile'
        run: cargo build --workspace --exclude xtask --target ${{ matrix.target }}
