[workspace]
resolver = "3"
members = [
    "crates/clispeak-proto",
    "crates/clispeak-text",
    "crates/clispeak-engine",
    "crates/clispeak-core",
    "crates/clispeak-cli",
    "crates/clispeak-daemon",
    "crates/clispeak-keystore",
    "app/src-tauri",
    "xtask",
]
# The M0 spike is throwaway and deliberately not part of the workspace.
exclude = ["spike/m0-iroh"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
# Decision 74. Inherited by every crate so `cargo metadata` stops reporting
# the workspace as unlicensed, which it did until the project went open
# source — nine crates with no `license` field at all.
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clispeak-proto = { path = "crates/clispeak-proto" }
clispeak-text = { path = "crates/clispeak-text" }
clispeak-engine = { path = "crates/clispeak-engine" }
clispeak-core = { path = "crates/clispeak-core" }
clispeak-daemon = { path = "crates/clispeak-daemon" }
clispeak-keystore = { path = "crates/clispeak-keystore" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
todo = "allow"

# Full debuginfo is the single largest memory consumer when linking, and this
# machine cannot afford it (see .cargo/config.toml). Line tables keep
# backtraces useful at a fraction of the cost.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
