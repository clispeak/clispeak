<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27F2F2"/>
      <stop offset="100%" stop-color="#00C7D9"/>
    </linearGradient>
  </defs>
  <!-- 0.72, and the number is measured rather than chosen.

       The art's bounding box is 720 x 585, so its half-diagonal is 464px of a
       1024 canvas - 0.453. A launcher guarantees the inner 66.7%, and on a
       round mask that is a *circle* of radius 0.333, not a square. The first
       attempt fitted the box to the square and used 0.90, which puts the
       bubble's corners at 0.408 and had them shaved off on a real phone.

       0.735 is the largest scale that fits; 0.72 leaves a little air. -->
  <g transform="translate(512,512) scale(0.72) translate(-512,-557.5)">

  <path
    d="M290 265
       H734
       C820 265 872 317 872 403
       V626
       C872 712 820 764 734 764
       H512
       L392 850
       V764
       H290
       C204 764 152 712 152 626
       V403
       C152 317 204 265 290 265Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="46"
    stroke-linejoin="round"
    stroke-linecap="round"/>

  <!-- Terminal prompt > -->
  <path
    d="M300 447 L390 512 L300 577"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Terminal underscore -->
  <line x1="420" y1="578" x2="505" y2="578"
        stroke="#FFFFFF"
        stroke-width="38"
        stroke-linecap="round"/>

  <!-- Sound waves -->
  <path d="M602 468 C630 495 630 529 602 556"
        fill="none" stroke="url(#cyan)" stroke-width="36" stroke-linecap="round"/>
  <path d="M655 426 C710 478 710 546 655 598"
        fill="none" stroke="url(#cyan)" stroke-width="36" stroke-linecap="round"/>
  <path d="M710 382 C790 454 790 570 710 642"
        fill="none" stroke="url(#cyan)" stroke-width="36" stroke-linecap="round"/>
  </g>
</svg>
