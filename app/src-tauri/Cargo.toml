[package]
name = "clispeak-app"
description = "The clispeak node as a desktop and mobile app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# Mobile builds link a library, not a binary; the desktop binary calls into it.
name = "clispeak_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clispeak-core.workspace = true
clispeak-engine.workspace = true
clispeak-proto.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde.workspace = true
anyhow.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
clispeak-text = { version = "0.1.0", path = "../../crates/clispeak-text" }
iroh = "1.1"
directories = "6.0.0"

# iOS builds reqwest without a default rustls crypto provider selected, so
# iroh's first HTTPS client panics at startup with "No rustls crypto provider
# is configured". Installing one explicitly is the documented fix; `ring` is
# already in the tree, so this selects rather than adds.
[target.'cfg(target_os = "ios")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
clispeak-keystore.workspace = true

# Putting the command-line tool on the PATH, which on Windows is a registry
# value and a broadcast to every window on the desktop. `winreg` is a safe
# wrapper and does the reading and writing; `windows` supplies the one call
# that has to be `unsafe`, and is already in the tree by way of Tauri.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# Not `workspace = true`: the workspace *forbids* unsafe, which cannot be
# lifted locally, and telling the desktop its environment changed is a Win32
# broadcast with no safe spelling. Denied rather than forbidden, so the one
# module that needs it says so and everything else still cannot.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
todo = "allow"
