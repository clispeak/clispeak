# Flatpak manifest for the clispeak desktop app.
#
# The app is packaged; the command-line tool deliberately is not. Entering a
# Flatpak sandbox costs ~86ms per invocation against the CLI's own 3ms, and
# that tool exists to be called repeatedly by an agent — exporting it would
# make it 30x slower and throw away the reason it is a thin client at all.
# Instead the app offers to install the CLI to ~/.local/bin, where it stays a
# plain fast binary. The two still find each other: their socket is abstract,
# so it lives in the network namespace, which is shared with the host.
#
# Binaries are taken prebuilt rather than compiled here. flatpak-builder runs
# offline, so a source build needs vendored crates; that is worth doing before
# publishing, and is unnecessary noise for installing locally.
app-id: org.clispeak.app
# The GNOME runtime, not Freedesktop: Tauri renders in WebKitGTK, which
# Freedesktop does not ship. Without it the app dies at startup with a missing
# libwebkit2gtk.
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: clispeak-app

finish-args:
  # iroh needs to reach peers and the relay.
  - --share=network
  # Speech has to come out of the speakers.
  - --socket=pulseaudio
  # The window itself.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # The device identity, kept in the system keyring like it is off-Flatpak.
  - --talk-name=org.freedesktop.secrets
  # The tray icon. An indicator publishes itself as its own bus name and then
  # tells the watcher about it, and the sandbox permits neither by default —
  # shipping the library is not enough on its own. The item name carries the
  # process id, which inside the sandbox is always 2.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-1
  # Where the app offers to put the command-line tool, so an agent can call it
  # without paying sandbox startup on every message.
  #
  # **These next two grants make the sandbox nominal, and that is stated here
  # rather than discovered.** `~/.local/bin` is on the user's PATH ahead of
  # `/usr/bin` on every mainstream distribution, so write access to it is
  # write access to the next command they type. `~/.claude` holds Claude
  # Code's hooks, which are commands it runs on the user's behalf. Either one
  # alone is an escape from the sandbox; together they are two.
  #
  # They are still here because the alternative is worse in a way users
  # actually meet: an unshared write *appears to succeed* inside a sandbox and
  # never reaches the host, so an app that offers to install a tool and then
  # silently does not is the failure this project keeps paying for. The
  # honest position is that this Flatpak is packaging, not containment
  # (#82, decision 77).
  #
  # Flathub will refuse `~/.local/bin` outright, so publishing there needs a
  # different answer, not a smaller version of this one.
  - --filesystem=~/.local/bin:create
  # Where agents keep skills. Narrow on purpose: an unshared write inside the
  # sandbox appears to succeed and never reaches the host, so the app must be
  # able to genuinely write anywhere it offers to. Any other location goes
  # through the command-line tool, which is not sandboxed.
  - --filesystem=~/.claude:create
  # Somewhere for a user-added voice to live. Piper and one voice are bundled
  # below, so this is only needed for voices added after install.
  - --persist=.local/share/clispeak

# Every module installs into /app/lib, which is where flatpak looks.
#
# Without this the GNOME 49 SDK's cmake picks `lib64` on x86_64, and the first
# module to notice is the second one: `ayatana-ido` puts its `.pc` in
# /app/lib64/pkgconfig, `libayatana-indicator` runs `pkg_check_modules` on it,
# and the build stops with "Package 'libayatana-ido3-0.4' not found" — a
# dependency that was built successfully thirty lines earlier. The shared
# module assumes `lib` too: its own `cleanup` lists `/lib/pkgconfig`, which
# quietly removed nothing.
build-options:
  libdir: /app/lib

modules:
  # The tray icon. The GNOME runtime ships no appindicator library, and
  # without one the window has no way back once it is closed — closing hides
  # the window on purpose, because the node has to keep running for peers and
  # for the CLI. The app survives without this (the tray failure is caught),
  # but the only way to reopen it would be `clispeak show`.
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  # Piper and one voice, bundled rather than downloaded on first run. The
  # sandbox has no system speech at all — the GNOME runtime ships no espeak —
  # so without this the app installs and then cannot say anything, and the
  # fallback it would report has nothing to fall back to.
  - name: piper
    buildsystem: simple
    build-commands:
      # The whole directory: the binary loads its ONNX runtime, phonemiser and
      # espeak-ng data from alongside itself.
      - mkdir -p /app/share/clispeak
      - cp -r piper /app/share/clispeak/piper
      - install -Dm644 en_US-ljspeech-medium.onnx /app/share/clispeak/voices/en_US-ljspeech-medium.onnx
      - install -Dm644 en_US-ljspeech-medium.onnx.json /app/share/clispeak/voices/en_US-ljspeech-medium.onnx.json
    sources:
      - type: archive
        url: https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
        sha256: a50cb45f355b7af1f6d758c1b360717877ba0a398cc8cbe6d2a7a3a26e225992
        strip-components: 0
      - type: file
        url: https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/ljspeech/medium/en_US-ljspeech-medium.onnx
        sha256: 6f52a751e2349abe7a76735eb09dc1875298c77ea2342ffd2fef79ff81b87f22
      - type: file
        url: https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/ljspeech/medium/en_US-ljspeech-medium.onnx.json
        sha256: 141d612cc0a95ed7efc1ca936b845c2364967f2e9217c5dbfcf69fc4d6c65860

  - name: clispeak
    buildsystem: simple
    build-commands:
      - install -Dm755 clispeak-app /app/bin/clispeak-app
      # Carried inside the sandbox so the app can copy it to the host path.
      - install -Dm755 clispeak /app/libexec/clispeak
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/org.clispeak.app.png
      - install -Dm644 org.clispeak.app.desktop /app/share/applications/org.clispeak.app.desktop
      - install -Dm644 org.clispeak.app.metainfo.xml /app/share/metainfo/org.clispeak.app.metainfo.xml
    sources:
      - type: file
        path: ../../target/release/clispeak-app
      - type: file
        path: ../../target/release/clispeak
      - type: file
        path: ../../app/src-tauri/icons/icon.png
      - type: file
        path: org.clispeak.app.desktop
      - type: file
        path: org.clispeak.app.metainfo.xml
